<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkinForge — Маркетплейс скинов и кейсов</title>
<style>
/* ================================================================
   SkinForge — полная дизайн-система
   Тёмный «арсенальный» стиль: неон, скошенные грани, сетка.
   ================================================================ */
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --void:#05060c;--panel:#0b0e1a;--panel2:#101528;--line:#1d2440;
  --neon:#7c5cff;--cyan:#29e7ff;--lime:#b6ff3d;--ember:#ff6b2c;
  --danger:#ff5f6d;--warn:#f5c451;
  --font-sans:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace;
}
html{color-scheme:dark;scroll-behavior:smooth}
body{
  font-family:var(--font-sans);color:#e7ecff;background:var(--void);
  background-image:
    radial-gradient(900px 600px at 8% -10%,rgba(124,92,255,.22),transparent 60%),
    radial-gradient(700px 500px at 100% 0%,rgba(41,231,255,.14),transparent 55%),
    linear-gradient(180deg,#05060c 0%,#070912 40%,#05060c 100%);
  background-attachment:fixed;min-height:100vh;line-height:1.6;
}
::selection{background:rgba(124,92,255,.4)}
a{color:var(--cyan);text-decoration:none;transition:color .2s}
a:hover{color:#7de8ff}
img{display:block;max-width:100%}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit;color:inherit}

/* ---------- scrollbar ---------- */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--void)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--neon),var(--cyan))}

/* ---------- утилитарные классы ---------- */
.container{max-width:1280px;margin:0 auto;padding:0 1rem}
.grid-lines{
  background-image:
    linear-gradient(rgba(124,92,255,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(124,92,255,.06) 1px,transparent 1px);
  background-size:42px 42px;
}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.flex{display:flex}.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}
.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap-1{gap:.25rem}.gap-2{gap:.5rem}.gap-3{gap:.75rem}.gap-4{gap:1rem}.gap-5{gap:1.25rem}.gap-6{gap:1.5rem}.gap-8{gap:2rem}
.grid{display:grid}
.sm-2{grid-template-columns:repeat(2,1fr)}.sm-3{grid-template-columns:repeat(3,1fr)}.sm-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.sm-2,.sm-3,.sm-4{grid-template-columns:1fr}}
@media(min-width:641px) and (max-width:1023px){.sm-3,.sm-4{grid-template-columns:repeat(2,1fr)}}
.text-center{text-align:center}.text-right{text-align:right}
.w-full{width:100%}.mt-auto{margin-top:auto}
.hidden{display:none!important}.block{display:block}
.relative{position:relative}.overflow-hidden{overflow:hidden}

/* ---------- типографика ---------- */
.mono-label{
  font-family:var(--font-mono);font-size:.68rem;letter-spacing:.22em;
  text-transform:uppercase;color:#7e8bab;
}
.display{
  font-family:var(--font-sans);font-weight:900;letter-spacing:.02em;
  text-transform:uppercase;line-height:.95;
}
.gradient-text{
  background:linear-gradient(96deg,#fff 10%,var(--lime) 45%,var(--cyan) 78%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

/* ---------- панели ---------- */
.panel{
  position:relative;
  background:linear-gradient(160deg,rgba(23,29,52,.9),rgba(9,12,22,.92));
  border:1px solid var(--line);backdrop-filter:blur(8px);
}
.panel-glow::before{
  content:"";position:absolute;inset:-1px;z-index:-1;
  background:linear-gradient(120deg,rgba(124,92,255,.55),transparent 40%,rgba(41,231,255,.35));
  clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);
}
.clip-corner{clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%)}
.clip-sm{clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}

/* ---------- кнопки ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  padding:.7rem 1.35rem;font-family:var(--font-mono);font-size:.75rem;
  letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  border:1px solid transparent;background:none;color:inherit;
  transition:transform .15s,filter .15s,background .2s;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);
}
.btn:active{transform:translateY(1px)}
.btn-primary{
  background:linear-gradient(96deg,var(--neon),var(--cyan));color:var(--void);
  box-shadow:0 0 0 1px rgba(124,92,255,.4),0 12px 34px -12px rgba(41,231,255,.7);
}
.btn-primary:hover{filter:brightness(1.12)}
.btn-lime{background:linear-gradient(96deg,var(--lime),var(--cyan));color:var(--void)}
.btn-ghost{background:rgba(255,255,255,.04);border-color:var(--line);color:#cbd5ff}
.btn-ghost:hover{background:rgba(124,92,255,.16);border-color:rgba(124,92,255,.6)}
.btn-danger{background:rgba(255,95,109,.12);border-color:rgba(255,95,109,.5);color:#ff98a2}
.btn-danger:hover{background:rgba(255,95,109,.24)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- поля ввода ---------- */
.field{
  width:100%;background:rgba(5,7,15,.85);border:1px solid var(--line);
  color:#e7ecff;padding:.65rem .85rem;font-size:.9rem;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.field:focus{border-color:rgba(124,92,255,.8);box-shadow:0 0 0 3px rgba(124,92,255,.16)}
.field::placeholder{color:#5c668a}
select.field option{background:#0b0e1a}
textarea.field{resize:vertical;min-height:80px}

/* ---------- карточки ---------- */
.skin-card{
  position:relative;overflow:hidden;
  transition:transform .2s,border-color .2s;
}
.skin-card:hover{transform:translateY(-4px);border-color:rgba(124,92,255,.55)}
.skin-card::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:var(--rarity,var(--neon));
  box-shadow:0 0 18px 2px var(--rarity,var(--neon));
}
.skin-img{
  width:100%;aspect-ratio:4/3;object-fit:cover;
  background:linear-gradient(135deg,var(--panel2),var(--void));
}

/* ---------- анимации ---------- */
@keyframes float-slow{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pulse-ring{0%{box-shadow:0 0 0 0 rgba(124,92,255,.5)}70%{box-shadow:0 0 0 18px rgba(124,92,255,0)}100%{box-shadow:0 0 0 0 rgba(124,92,255,0)}}
@keyframes drop-in{from{opacity:0;transform:scale(.7) rotate(-6deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes roll{from{transform:translateX(0)}to{transform:translateX(var(--roll-to,-60%))}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.anim-fade{animation:fadeIn .4s ease-out both}
.float{animation:float-slow 7s ease-in-out infinite}
.drop-in{animation:drop-in .6s cubic-bezier(.2,1.4,.4,1) forwards}

/* ---------- бейджи редкости ---------- */
.rarity-common{--r:#9aa4b2}.rarity-uncommon{--r:#5e9bd8}.rarity-rare{--r:#4b69ff}
.rarity-epic{--r:#8847ff}.rarity-legendary{--r:#d32ce6}.rarity-mythical{--r:#ff9a3c}.rarity-exotic{--r:#ff3b3b}

/* ---------- модальное окно ---------- */
.modal-overlay{
  position:fixed;inset:0;z-index:1000;background:rgba(5,6,12,.85);
  backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal-box{
  max-width:520px;width:95%;max-height:90vh;overflow-y:auto;
  animation:fadeIn .35s ease-out both;
}

/* ---------- toast ---------- */
.toast{
  position:fixed;top:5.5rem;right:1rem;z-index:2000;min-width:260px;max-width:400px;
  padding:1rem 1.2rem;border-left:4px solid var(--cyan);background:var(--panel);
  font-family:var(--font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;
  transform:translateX(120%);transition:transform .4s ease;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);
}
.toast.show{transform:none}
.toast.error{border-color:var(--danger);color:#ff98a2}
.toast.ok{border-color:var(--lime);color:var(--lime)}

/* ---------- таблицы ---------- */
.sf-table{width:100%;border-collapse:collapse;text-align:left;font-size:.82rem}
.sf-table th{
  font-family:var(--font-mono);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;
  color:#5c668a;padding:.75rem .8rem;border-bottom:1px solid var(--line);
}
.sf-table td{padding:.75rem .8rem;border-bottom:1px solid rgba(29,36,64,.5)}
.sf-table tr:last-child td{border-bottom:none}
.sf-table a{color:#e7ecff}.sf-table a:hover{color:var(--cyan)}

/* ---------- навигация ---------- */
.header{
  position:sticky;top:0;z-index:500;border-bottom:1px solid rgba(29,36,64,.8);
  background:rgba(5,6,12,.85);backdrop-filter:blur(16px);
}
.header-inner{
  display:flex;align-items:center;gap:1rem;height:4rem;padding:0 1rem;
  max-width:1280px;margin:0 auto;
}
.logo{display:flex;align-items:center;gap:.6rem}
.logo-mark{
  width:2.2rem;height:2.2rem;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--neon),var(--cyan));
  clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);
  font-family:var(--font-mono);font-size:.75rem;font-weight:900;color:var(--void);
}
.logo-text{font-weight:900;font-size:1.25rem;letter-spacing:.04em;text-transform:uppercase;color:#fff}
.logo-text span{color:var(--cyan)}
.nav-links{display:flex;gap:.25rem;margin-left:1rem}
.nav-links a{
  padding:.4rem .75rem;font-family:var(--font-mono);font-size:.68rem;
  letter-spacing:.18em;text-transform:uppercase;color:#94a3b8;
  transition:color .2s;
}
.nav-links a:hover,.nav-links a.active{color:#fff}
.header-right{margin-left:auto;display:flex;align-items:center;gap:.5rem}
.balance-badge{
  display:flex;align-items:center;gap:.5rem;border:1px solid var(--line);
  background:var(--panel);padding:.35rem .75rem;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);
  font-family:var(--font-mono);font-size:.72rem;
}
@media(max-width:768px){
  .nav-links{display:none}
  .header-right .btn span{display:none}
}

/* ---------- секции ---------- */
section{padding:3rem 0}
.section-title{margin-bottom:1.5rem}
.section-title h2{
  font-size:clamp(1.8rem,5vw,2.8rem);line-height:.95;font-weight:900;
  text-transform:uppercase;color:#fff;
}

/* ---------- footer ---------- */
.footer{border-top:1px solid var(--line);background:rgba(5,6,12,.7)}
.footer-grid{display:grid;gap:2rem;padding:3rem 0}
@media(min-width:768px){.footer-grid{grid-template-columns:2fr 1fr 1fr 1fr}}
.footer-copy{
  border-top:1px solid rgba(29,36,64,.7);padding:1rem 0;text-align:center;
  font-family:var(--font-mono);font-size:.62rem;letter-spacing:.24em;
  text-transform:uppercase;color:#475569;
}

/* ---------- загрузчик файлов ---------- */
.upload-zone{
  border:2px dashed var(--line);background:rgba(5,7,15,.6);padding:1.2rem;
  text-align:center;cursor:pointer;transition:border-color .2s,background .2s;
}
.upload-zone:hover{border-color:rgba(124,92,255,.7);background:rgba(124,92,255,.05)}
.upload-zone.drag-over{border-color:var(--lime);background:rgba(182,255,61,.05)}
.upload-preview{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}
.upload-preview .thumb{
  width:5rem;height:4rem;border:1px solid var(--line);object-fit:cover;
  position:relative;overflow:hidden;
}
.upload-preview .thumb .remove{
  position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);
  border:1px solid var(--danger);color:var(--danger);
  font-size:.55rem;width:16px;height:16px;display:grid;place-items:center;cursor:pointer;
}

/* ---------- чекбокс-список ---------- */
.checkbox-list{
  max-height:12rem;overflow-y:auto;border:1px solid var(--line);background:rgba(5,7,15,.6);padding:.5rem;
}
.checkbox-list label{
  display:flex;align-items:center;gap:.5rem;padding:.35rem .5rem;
  font-family:var(--font-mono);font-size:.72rem;color:#cbd5e1;cursor:pointer;
}
.checkbox-list label:hover{background:rgba(124,92,255,.1)}

/* ---------- рулетка ---------- */
.case-reel-wrap{position:relative;height:9rem;overflow:hidden;background:rgba(5,6,12,.6)}
.case-reel-wrap .marker{
  position:absolute;left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%);
  background:var(--lime);z-index:10;box-shadow:0 0 18px 4px rgba(182,255,61,.7);
}
.case-reel-wrap .fade-l,.case-reel-wrap .fade-r{
  position:absolute;top:0;bottom:0;width:3rem;z-index:5;
}
.case-reel-wrap .fade-l{left:0;background:linear-gradient(90deg,var(--void),transparent)}
.case-reel-wrap .fade-r{right:0;background:linear-gradient(-90deg,var(--void),transparent)}
.case-reel{
  display:flex;gap:.75rem;height:100%;align-items:center;padding:0 1rem;
  transition:none;
}
.case-reel.rolling{
  animation:roll 2.8s cubic-bezier(.08,.82,.05,1) forwards;
}
.reel-item{
  flex:0 0 7rem;height:7rem;position:relative;overflow:hidden;
  border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;
  justify-content:flex-end;
}
.reel-item::before{
  content:"";position:absolute;inset:0;opacity:.6;
}
.reel-item span{
  position:relative;z-index:2;background:rgba(5,6,12,.8);
  padding:.2rem .4rem;font-family:var(--font-mono);font-size:.5rem;
  text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ---------- drag-handle ---------- */
.drag-indicator{
  position:absolute;left:50%;top:-6px;transform:translateX(-50%);
  width:32px;height:5px;background:var(--line);border-radius:2px;
}

/* ---------- pagnation tabs ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.25rem}
.tab-btn{
  border:1px solid var(--line);background:transparent;color:#94a3b8;
  padding:.55rem 1rem;font-family:var(--font-mono);font-size:.68rem;
  letter-spacing:.16em;text-transform:uppercase;transition:all .2s;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%);
}
.tab-btn.active{border-color:var(--neon);background:rgba(124,92,255,.2);color:#fff}
.tab-btn:hover{color:#fff}

/* ---------- фильтры ---------- */
.chip{
  display:inline-block;border:1px solid var(--line);background:transparent;
  padding:.4rem .75rem;font-family:var(--font-mono);font-size:.65rem;
  letter-spacing:.16em;text-transform:uppercase;color:#94a3b8;
  transition:all .2s;cursor:pointer;
}
.chip.active{border-color:var(--neon);background:rgba(124,92,255,.2);color:#fff}
.chip:hover{color:#fff}

/* ---------- статистика карточки ---------- */
.stat-card{padding:1.25rem}
.stat-card .value{font-size:2rem;font-weight:900;line-height:1;color:#fff;margin:.3rem 0}
.stat-card .label{font-size:.62rem}

/* ---------- инвентарь карточка ---------- */
.inv-row{
  display:flex;flex-wrap:wrap;align-items:center;gap:1rem;
  padding:1rem;border:1px solid rgba(29,36,64,.5);background:rgba(5,7,15,.5);
  margin-bottom:.5rem;
}
.inv-row img{width:5rem;height:3.5rem;object-fit:cover;border:1px solid var(--line)}
.inv-row .info{flex:1;min-width:120px}
.inv-row .info .title{font-weight:700;color:#fff}
.inv-row .info .meta{font-family:var(--font-mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.16em;color:#5c668a}
.inv-row .actions{margin-left:auto}

/* ---------- notice ---------- */
.notice{
  padding:.75rem 1rem;font-family:var(--font-mono);font-size:.68rem;
  text-transform:uppercase;letter-spacing:.14em;border-left:4px solid;
}
.notice.ok{border-color:var(--lime);background:rgba(182,255,61,.08);color:var(--lime)}
.notice.error{border-color:var(--danger);background:rgba(255,95,109,.08);color:#ff98a2}
.notice.warn{border-color:var(--warn);background:rgba(245,196,81,.08);color:var(--warn)}
.notice.info{border-color:var(--cyan);background:rgba(41,231,255,.08);color:var(--cyan)}
</style>
</head>
<body>

<!-- ============================================================ HEADER -->
<header class="header" id="appHeader"></header>

<!-- ============================================================ MAIN -->
<main id="appMain"></main>

<!-- ============================================================ FOOTER -->
<footer class="footer" id="appFooter"></footer>

<!-- ============================================================ MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<!-- ============================================================ TOAST -->
<div class="toast" id="toast"></div>

<script>
/* ====================================================================
   SkinForge — полный SPA на vanilla JS
   Всё в одном файле: данные, авторизация, каталог, блог, личные кабинеты.
   ==================================================================== */

// ======================== УТИЛИТЫ ========================

const $ = (sel, ctx) => (ctx || document).querySelector(sel);
const $$ = (sel, ctx) => [...(ctx || document).querySelectorAll(sel)];

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function money(k) {
  if (!k && k !== 0) return '—';
  const v = (k||0)/100;
  return new Intl.NumberFormat('ru-RU',{minimumFractionDigits:v%1===0?0:2,maximumFractionDigits:2}).format(v)+' ₽';
}

function parseMoney(s) {
  const v = parseFloat(String(s).replace(/\s/g,'').replace(',','.'));
  return (!isFinite(v)||v<0)?0:Math.round(v*100);
}

function formatDate(d) {
  if (!d) return '—';
  return new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(d));
}

const RARITIES = [
  {key:'common',label:'Ширпотреб',color:'#9aa4b2'},
  {key:'uncommon',label:'Промышленное',color:'#5e9bd8'},
  {key:'rare',label:'Армейское',color:'#4b69ff'},
  {key:'epic',label:'Запрещённое',color:'#8847ff'},
  {key:'legendary',label:'Засекреченное',color:'#d32ce6'},
  {key:'mythical',label:'Тайное',color:'#ff9a3c'},
  {key:'exotic',label:'Контрабанда',color:'#ff3b3b'},
];

const EXTERIORS = ['Factory New','Minimal Wear','Field-Tested','Well-Worn','Battle-Scarred'];

const STATUS_MAP = {
  pending:{label:'На модерации',color:'#f5c451'},
  approved:{label:'Опубликовано',color:'#4ade80'},
  rejected:{label:'Отклонено',color:'#ff5f6d'},
};

function rarityInfo(key) { return RARITIES.find(r=>r.key===key)||RARITIES[0]; }
function statusInfo(key) { return STATUS_MAP[key]||STATUS_MAP.pending; }

function escHtml(s) {
  const d=document.createElement('div');d.textContent=s;return d.innerHTML;
}

function fileToDataURL(file) {
  return new Promise((resolve,reject) => {
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}

function toast(msg, type='ok') {
  const el=$('#toast');
  el.textContent=msg;
  el.className='toast '+type;
  requestAnimationFrame(()=>el.classList.add('show'));
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>el.classList.remove('show'),3500);
}

function openModal(html) {
  $('#modalBox').innerHTML=html;
  $('#modalOverlay').classList.add('active');
}

function closeModal() {
  $('#modalOverlay').classList.remove('active');
}

$('#modalOverlay').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

function navigate(page, params={}) {
  APP.page=page;
  APP.params=params;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ======================== STORE (localStorage) ========================

const Store = {
  get(key, fallback) {
    try { const v=localStorage.getItem('sf_'+key); return v?JSON.parse(v):fallback; }
    catch { return fallback; }
  },
  set(key, value) { localStorage.setItem('sf_'+key, JSON.stringify(value)); },
};

function getUsers() { return Store.get('users',[]); }
function saveUsers(u) { Store.set('users',u); }
function getSessions() { return Store.get('sessions',[]); }
function saveSessions(s) { Store.set('sessions',s); }
function getSkins() { return Store.get('skins',[]); }

// ======================== AUTH ========================

function hashPw(pw) {
  let h=0; for(let i=0;i<pw.length;i++) { h=((h<<5)-h)+pw.charCodeAt(i); h|=0; }
  return 'h_'+Math.abs(h).toString(36)+'_'+pw.length;
}

function currentUser() {
  const sid=Store.get('currentSession',null);
  if (!sid) return null;
  const sessions=getSessions();
  const s=sessions.find(x=>x.id===sid);
  if (!s) return null;
  if (s.expiresAt && new Date(s.expiresAt)<new Date()) { Store.set('currentSession',null); return null; }
  const users=getUsers();
  const u=users.find(x=>x.id===s.userId);
  if (!u || u.status==='banned') return null;
  return u;
}

function registerUser(email, username, password) {
  const users=getUsers();
  if (users.find(u=>u.email.toLowerCase()===email.toLowerCase()||u.username.toLowerCase()===username.toLowerCase())) {
    return {ok:false,message:'E-mail или никнейм уже заняты'};
  }
  const u={id:uid(),email:email.toLowerCase(),username,passwordHash:hashPw(password),role:'user',status:'active',bio:'',avatar:null,balance:50000,createdAt:new Date().toISOString()};
  users.push(u);saveUsers(users);
  const sid=uid();
  const sessions=getSessions();
  sessions.push({id:sid,userId:u.id,expiresAt:new Date(Date.now()+30*86400000).toISOString()});
  saveSessions(sessions);
  Store.set('currentSession',sid);
  return {ok:true,user:u};
}

function loginUser(identity, password) {
  const users=getUsers();
  const u=users.find(x=>(x.email.toLowerCase()===identity.toLowerCase()||x.username.toLowerCase()===identity.toLowerCase()));
  if (!u) return {ok:false,message:'Пользователь не найден'};
  if (u.passwordHash!==hashPw(password)) return {ok:false,message:'Неверный пароль'};
  if (u.status==='banned') return {ok:false,message:'Аккаунт заблокирован'};
  const sid=uid();
  const sessions=getSessions();
  sessions.push({id:sid,userId:u.id,expiresAt:new Date(Date.now()+30*86400000).toISOString()});
  saveSessions(sessions);
  Store.set('currentSession',sid);
  return {ok:true,user:u};
}

function logoutUser() {
  const sid=Store.get('currentSession',null);
  if (sid) {
    const sessions=getSessions().filter(s=>s.id!==sid);
    saveSessions(sessions);
  }
  Store.set('currentSession',null);
  navigate('home');
}

function updateUser(id, updates) {
  const users=getUsers();
  const i=users.findIndex(u=>u.id===id);
  if (i===-1) return;
  Object.assign(users[i],updates);
  saveUsers(users);
}

// ----- SKINS CATALOG -----
function renderSkins() {
  const p = APP.params;
  const allSkins = getSkins().filter(s=>s.status==='approved');
  const games = [...new Set(allSkins.map(s=>s.game).filter(Boolean))];

  let filtered = allSkins;
  if (p.q) { const q=p.q.toLowerCase(); filtered=filtered.filter(s=>(s.title+s.weapon+s.description).toLowerCase().includes(q)); }
  if (p.game) filtered=filtered.filter(s=>s.game===p.game);
  if (p.rarity) filtered=filtered.filter(s=>s.rarity===p.rarity);

  if (p.sort==='price-asc') filtered.sort((a,b)=>a.price-b.price);
  else if (p.sort==='price-desc') filtered.sort((a,b)=>b.price-a.price);
  else if (p.sort==='popular') filtered.sort((a,b)=>b.views-a.views);
  else filtered.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

  return `
    <div class="container" style="padding:2.5rem 0">
      <div class="section-title"><p class="mono-label">Маркетплейс</p><h2>Каталог скинов · ${filtered.length}</h2></div>

      <div class="panel clip-corner" style="padding:1.25rem;margin-bottom:1.5rem">
        <div class="grid" style="grid-template-columns:1.4fr 1fr 1fr auto;gap:1rem" id="skinFilterForm">
          <div><label class="mono-label">Поиск</label><input class="field" style="margin-top:.4rem" placeholder="AK-47, нож…" id="skinQ" value="${escHtml(p.q||'')}"></div>
          <div><label class="mono-label">Игра</label><select class="field" style="margin-top:.4rem" id="skinGame"><option value="">Любая</option>${games.map(g=>`<option value="${escHtml(g)}" ${p.game===g?'selected':''}>${escHtml(g)}</option>`).join('')}</select></div>
          <div><label class="mono-label">Редкость</label><select class="field" style="margin-top:.4rem" id="skinRarity"><option value="">Любая</option>${RARITIES.map(r=>`<option value="${r.key}" ${p.rarity===r.key?'selected':''}>${r.label}</option>`).join('')}</select></div>
          <div style="display:flex;align-items:flex-end;gap:.5rem">
            <select class="field" style="margin-top:.4rem" id="skinSort"><option value="new" ${p.sort==='new'||!p.sort?'selected':''}>Новые</option><option value="price-asc" ${p.sort==='price-asc'?'selected':''}>Цена ↑</option><option value="price-desc" ${p.sort==='price-desc'?'selected':''}>Цена ↓</option><option value="popular" ${p.sort==='popular'?'selected':''}>Популярные</option></select>
            <button class="btn btn-primary" id="skinFilterBtn">Найти</button>
          </div>
        </div>
      </div>

      <div class="flex flex-wrap gap-2" style="margin-bottom:1.5rem">
        <span class="chip ${!p.game?'active':''}" data-filter-game="">Все игры</span>
        ${games.map(g=>`<span class="chip ${p.game===g?'active':''}" data-filter-game="${escHtml(g)}">${escHtml(g)}</span>`).join('')}
      </div>
      <div class="flex flex-wrap gap-2" style="margin-bottom:2rem">
        <span class="chip ${!p.rarity?'active':''}" data-filter-rarity="">Любая</span>
        ${RARITIES.map(r=>`<span class="chip ${p.rarity===r.key?'active':''}" data-filter-rarity="${r.key}"><span style="display:inline-block;width:8px;height:8px;margin-right:4px;background:${r.color};vertical-align:middle"></span>${r.label}</span>`).join('')}
      </div>

      ${filtered.length===0?`
        <div class="panel clip-corner text-center" style="padding:2.5rem">
          <p class="display" style="font-size:1.5rem;color:#fff">Ничего не найдено</p>
          <p style="margin-top:.5rem;font-size:.85rem;color:#94a3b8">Попробуйте изменить фильтры или загляните в <a href="#" onclick="event.preventDefault();navigate('cases')" style="color:var(--cyan)">кейсы</a>.</p>
        </div>
      `:`
        <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.25rem">
          ${filtered.map(s=>skinCardHtml(s)).join('')}
        </div>
      `}
    </div>
  `;
}

  const id = APP.params.id;

  return `

// ----- OPEN CASE -----
function openCase(caseId) {
  const user = currentUser();
  if (!user) { toast('Войдите, чтобы открывать кейсы','error'); return; }
  const cs = getCases().find(c=>c.id===caseId);
  if (!cs||cs.status!=='approved') { toast('Кейс недоступен','error'); return; }
  if (user.balance<cs.price) { toast('Недостаточно средств','error'); return; }

  const contents = getSelsForCase(cs);
  if (contents.length===0) { toast('Кейс пуст','error'); return; }

  const totalWeight = contents.reduce((a,c)=>a+c.weight,0);
  let roll = Math.random()*totalWeight;
  let drop = contents[0];
  for (const item of contents) { roll-=item.weight; if(roll<=0){drop=item;break;} }

  // Анимация
  const reel = $('#caseReel');
  if (reel) {
    const strip = [];
    for (let i=0;i<42;i++) {
      const pick = contents[Math.floor(Math.random()*contents.length)];
      strip.push(pick.skin);
    }
    strip[38] = drop.skin;
    reel.innerHTML = strip.map((s,i)=>reelItemHtml(s,0,i)).join('');
    reel.style.transform='';
    reel.classList.remove('rolling');
    void reel.offsetWidth;
    reel.style.setProperty('--roll-to','-78%');
    reel.classList.add('rolling');
  }

  // Списать баланс и добавить в инвентарь
  const users = getUsers();
  const u = users.find(x=>x.id===user.id);
  if (u) {
    u.balance -= cs.price;
    saveUsers(users);
  }
  const orders = getOrders();
  orders.push({id:'o_'+uid(),userId:user.id,total:cs.price,status:'paid',items:cs.title+' → '+drop.skin.title,createdAt:new Date().toISOString()});
  saveOrders(orders);
  const inv = getInventory();
  inv.push({id:'i_'+uid(),userId:user.id,skinId:drop.skin.id,source:'case',sourceCaseId:cs.id,pricePaid:cs.price,createdAt:new Date().toISOString()});
  saveInventory(inv);

  const chance = ((drop.weight/totalWeight)*100).toFixed(1);
  const r = rarityInfo(drop.skin.rarity);

  setTimeout(()=>{
    const zone = $('#caseDropZone');
    if (zone) {
      zone.innerHTML = `
        <div style="border-top:1px solid var(--line);padding:1.5rem">
          <p class="mono-label">Ваш дроп</p>
          <div class="drop-in" style="margin-top:.75rem;display:flex;flex-wrap:wrap;align-items:center;gap:1.25rem;border:1px solid ${r.color};background:${r.color}14;padding:1rem">
            <div style="width:8rem;height:6rem;overflow:hidden;border:1px solid var(--line);background:rgba(5,7,15,.6)">
              <img src="${escHtml(drop.skin.imageUrl||'')}" alt="" style="width:100%;height:100%;object-fit:cover">
            </div>
            <div>
              <span style="padding:.15rem .4rem;font-family:var(--font-mono);font-size:.58rem;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--void);background:${r.color}">${r.label}</span>
              <p class="display" style="font-size:1.4rem;color:#fff;margin-top:.3rem">${escHtml(drop.skin.title)}</p>
              <p style="font-family:var(--font-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.16em;color:#94a3b8">${escHtml(drop.skin.exterior)} · рыночная ${money(drop.skin.price)} · шанс ${chance}%</p>
            </div>
            <span style="margin-left:auto;font-family:var(--font-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.2em;color:var(--lime)">добавлено в инвентарь →</span>
          </div>
        </div>
      `;
    }
    renderHeader();
    toast(`Кейс открыт! Выпал: ${drop.skin.title}`,'ok');
  },3000);
}

  return `

function renderPostDetail() {
  const slug = APP.params.slug;
  const post = getPosts().find(p=>p.slug===slug);
  if (!post) return '<div class="container text-center" style="padding:6rem 0"><h1 class="display" style="font-size:3rem;color:#fff">404</h1></div>';
  const author = getUsers().find(u=>u.id===post.authorId);

  const videos = (post.attachments||[]).filter(a=>a.kind==='video');
  const files = (post.attachments||[]).filter(a=>a.kind==='file');
  const tags = post.tags.split(',').map(t=>t.trim()).filter(Boolean);

  function embedUrl(url) {
    if (!url) return '';
    const yt=url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
    if (yt) return 'https://www.youtube.com/embed/'+yt[1];
    const vm=url.match(/vimeo\.com\/(\d+)/);
    if (vm) return 'https://player.vimeo.com/video/'+vm[1];
    return url;
  }

  const paragraphs = post.body.split('\n').filter(Boolean).map(p=>`<p>${escHtml(p)}</p>`).join('');

  return `
    <article class="container" style="max-width:900px;padding:2.5rem 0">
      <nav style="margin-bottom:1.5rem;font-family:var(--font-mono);font-size:.65rem;text-transform:uppercase;letter-spacing:.2em;color:#5c668a">

        <a href="#" onclick="event.preventDefault();navigate('blog')" style="color:#5c668a">Блог</a> /
        <span style="color:#cbd5e1">${escHtml(post.title)}</span>

      <div class="flex flex-wrap gap-2">
        ${tags.map(t=>`<a href="#" onclick="event.preventDefault();APP.params={tag:'${t}'};navigate('blog')" style="border:1px solid var(--line);padding:.15rem .5rem;font-family:var(--font-mono);font-size:.58rem;text-transform:uppercase;letter-spacing:.2em;color:var(--cyan)">#${escHtml(t)}</a>`).join('')}
      </div>
      <h1 class="display" style="font-size:clamp(2rem,5vw,3rem);margin-top:.8rem;color:#fff">${escHtml(post.title)}</h1>
      <p style="margin-top:.5rem;font-size:1rem;color:#94a3b8">${escHtml(post.excerpt)}</p>
      <div class="flex flex-wrap gap-4" style="margin-top:1rem;padding:.75rem 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-family:var(--font-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.2em;color:#5c668a">
        <span>✍ ${escHtml(author?.username||'редакция')}</span><span>◷ ${formatDate(post.createdAt)}</span><span>👁 ${(post.views||0)+1}</span>
        <span style="color:var(--cyan)">🖼 ${images.length}</span><span style="color:var(--ember)">🎬 ${videos.length+(post.videoUrl?1:0)}</span><span style="color:var(--lime)">📎 ${files.length}</span>
      </div>

      ${post.coverUrl?`<div class="panel clip-corner overflow-hidden" style="margin-top:2rem"><img src="${escHtml(post.coverUrl)}" alt="" style="width:100%;aspect-ratio:2.4/1;object-fit:cover"></div>`:''}

      <div style="margin-top:2rem;display:flex;flex-direction:column;gap:1.25rem;font-size:.95rem;color:#cbd5e1;line-height:1.8">${paragraphs}</div>

      ${post.videoUrl?`
        <section style="margin-top:2.5rem">
          <h2 class="display" style="font-size:1.5rem;color:#fff;margin-bottom:1rem">Видео</h2>
          <div class="panel clip-corner overflow-hidden" style="aspect-ratio:16/9">
            <iframe src="${embedUrl(post.videoUrl)}" style="width:100%;height:100%;border:none" allowfullscreen></iframe>

      `:''}

      ${images.length?`
        <section style="margin-top:2.5rem">

        </section>

      <div class="panel clip-corner flex flex-wrap items-center gap-4" style="margin-top:3rem;padding:1.25rem">

    </article>
  `;

// ======================== EVENT HANDLERS ========================

function attachPageEvents() {
  // Login form
  const loginForm = $('#loginForm');
  if (loginForm) loginForm.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(loginForm);
    const res = loginUser(fd.get('identity'), fd.get('password'));
    if (res.ok) {
      toast('Добро пожаловать, '+res.user.username,'ok');
      navigate(res.user.role==='admin'?'admin':res.user.role==='author'?'studio':'dashboard');
    } else {
      $('#loginError').innerHTML=`<div class="notice error" style="margin-top:1rem">${escHtml(res.message)}</div>`;
    }
  });

  // Register form
  const regForm = $('#regForm');
  if (regForm) regForm.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(regForm);
    if (fd.get('password')!==fd.get('repeat')) {
      $('#regError').innerHTML=`<div class="notice error" style="margin-top:1rem">Пароли не совпадают</div>`;
      return;
    }
    const res = registerUser(fd.get('email'), fd.get('username'), fd.get('password'));
    if (res.ok) {
      toast('Кабинет создан! +500 ₽','ok');
      navigate('dashboard');
    } else {
      $('#regError').innerHTML=`<div class="notice error" style="margin-top:1rem">${escHtml(res.message)}</div>`;
    }
  });

  // Dashboard tabs
  $$('[data-dash-tab]').forEach(b=>b.addEventListener('click',()=>{
    APP.params={...APP.params,tab:b.dataset.dashTab};renderMain();attachPageEvents();
  }));

  // Studio tabs
  $$('[data-studio-tab]').forEach(b=>b.addEventListener('click',()=>{
    APP.params={...APP.params,tab:b.dataset.studioTab};renderMain();attachPageEvents();
  }));

  // Admin tabs
  $$('[data-admin-tab]').forEach(b=>b.addEventListener('click',()=>{
    APP.params={...APP.params,tab:b.dataset.adminTab};renderMain();attachPageEvents();
  }));

  // Skin filters
  const skinBtn = $('#skinFilterBtn');
  if (skinBtn) skinBtn.addEventListener('click',()=>{
    APP.params={q:$('#skinQ').value,game:$('#skinGame').value,rarity:$('#skinRarity').value,sort:$('#skinSort').value};
    renderMain();attachPageEvents();
  });
  $$('[data-filter-game]').forEach(c=>c.addEventListener('click',()=>{
    APP.params={...APP.params,game:c.dataset.filterGame};renderMain();attachPageEvents();
  }));
  $$('[data-filter-rarity]').forEach(c=>c.addEventListener('click',()=>{
    APP.params={...APP.params,rarity:c.dataset.filterRarity};renderMain();attachPageEvents();
  }));

  // Blog tags
  $$('[data-blog-tag]').forEach(c=>c.addEventListener('click',()=>{
    APP.params={tag:c.dataset.blogTag};renderMain();attachPageEvents();
  }));

  // Deposit
  const depForm = $('#depositForm');
  if (depForm) depForm.addEventListener('submit',e=>{
    e.preventDefault();
    const amt = parseMoney(depForm.elements.amount.value);
    if (amt<=0) { toast('Некорректная сумма','error'); return; }
    const user = currentUser();
    updateUser(user.id,{balance:user.balance+amt});
    toast('Баланс пополнен: +'+money(amt),'ok');
    renderMain();attachPageEvents();
  });
  $$('.quick-deposit').forEach(b=>b.addEventListener('click',()=>{
    const input = depForm?.querySelector('[name="amount"]');
    if (input) input.value=b.dataset.amount;
  }));

  // Sell item
  $$('.sell-item-btn').forEach(b=>b.addEventListener('click',()=>{
    const itemId = b.dataset.itemId;
    const skinPrice = parseInt(b.dataset.skinPrice);
    const payout = Math.round(skinPrice*0.7);
    const inv = getInventory().filter(i=>i.id!==itemId);
    saveInventory(inv);
    const user = currentUser();
    updateUser(user.id,{balance:user.balance+payout});
    toast('Продано за '+money(payout),'ok');
    renderMain();attachPageEvents();
  }));

  // Profile form
  const profForm = $('#profileForm');
  if (profForm) profForm.addEventListener('submit',async e=>{
    e.preventDefault();
    const fd = new FormData(profForm);
    const user = currentUser();
    let avatar = user.avatar;
    const fileInput = $('#avatarInput');
    if (fileInput && fileInput.files.length>0) {
      try { avatar = await fileToDataURL(fileInput.files[0]); } catch {}
    }
    updateUser(user.id,{username:fd.get('username'),bio:fd.get('bio'),avatar});
    toast('Профиль сохранён','ok');
    render();attachPageEvents();
  });

  // Upload zones
  $$('[data-upload-for]').forEach(zone=>{
    const input = zone.querySelector('input[type="file"]');
    if (!input) return;
    zone.addEventListener('click',()=>input.click());
    zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag-over');});
    zone.addEventListener('dragleave',()=>zone.classList.remove('drag-over'));
    zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drag-over');if(e.dataTransfer.files.length)input.files=e.dataTransfer.files;});
    const preview = zone.querySelector('.upload-preview');
    input.addEventListener('change',()=>{
      if (!preview) return;
      preview.innerHTML='';
      Array.from(input.files||[]).forEach(f=>{
        const isImg = f.type.startsWith('image/');
        const d = document.createElement('div');
        d.className='thumb';
        if (isImg) {
          const img = document.createElement('img');
          img.src=URL.createObjectURL(f);
          img.style.cssText='width:100%;height:100%;object-fit:cover';
          d.appendChild(img);
        } else {
          d.innerHTML=`<div style="width:100%;height:100%;display:grid;place-items:center;background:rgba(5,7,15,.7);font-size:1.5rem">${f.type.startsWith('video/')?'🎬':'📎'}</div>`;
        }
        const rm = document.createElement('span');
        rm.className='remove';rm.textContent='✕';
        rm.addEventListener('click',e=>{e.stopPropagation();d.remove();});
        d.appendChild(rm);
        const nm = document.createElement('div');
        nm.style.cssText='font-family:var(--font-mono);font-size:.5rem;text-transform:uppercase;letter-spacing:.1em;color:#5c668a;max-width:5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
        nm.textContent=f.name;
        const wrapper = document.createElement('div');
        wrapper.appendChild(d);wrapper.appendChild(nm);
        preview.appendChild(wrapper);
      });
    });
  });

  // Studio skin form
  const skinForm = $('#studioSkinForm');
  if (skinForm) skinForm.addEventListener('submit',async e=>{
    e.preventDefault();
    const fd = new FormData(skinForm);
    const user = currentUser();
    let imageUrl = fd.get('imageUrl')||'https://picsum.photos/seed/'+uid()+'/600/450';
    const imgInput = skinForm.querySelector('[name="imageFile"]');
    if (imgInput && imgInput.files.length>0) {
      try { imageUrl = await fileToDataURL(imgInput.files[0]); } catch {}
    }
    const skin = {id:'s_'+uid(),title:fd.get('title'),weapon:fd.get('weapon')||'',game:fd.get('game')||'CS2',rarity:fd.get('rarity'),exterior:fd.get('exterior'),floatValue:fd.get('floatValue')||'',price:parseMoney(fd.get('price')),description:fd.get('description')||'',imageUrl,status:'pending',authorId:user.id,reviewerId:'',reviewNote:'',views:0,createdAt:new Date().toISOString(),reviewedAt:null};
    const skins = getSkins();skins.push(skin);saveSkins(skins);
    toast('Скин отправлен на модерацию','ok');
    APP.params={tab:'mine'};renderMain();attachPageEvents();
  });

  // Studio case form
  const caseForm = $('#studioCaseForm');
  if (caseForm) caseForm.addEventListener('submit',async e=>{
    e.preventDefault();
    const fd = new FormData(caseForm);
    const user = currentUser();
    let imageUrl = fd.get('imageUrl')||'https://picsum.photos/seed/case_'+uid()+'/800/500';
    const imgInput = caseForm.querySelector('[name="imageFile"]');
    if (imgInput && imgInput.files.length>0) {
      try { imageUrl = await fileToDataURL(imgInput.files[0]); } catch {}
    }
    const skinIds = fd.getAll('skinIds');
    const cs = {id:'c_'+uid(),title:fd.get('title'),game:fd.get('game')||'CS2',price:parseMoney(fd.get('price')),description:fd.get('description')||'',imageUrl,status:'pending',authorId:user.id,skinIds,weights:skinIds.map(()=>10),createdAt:new Date().toISOString()};
    const cases = getCases();cases.push(cs);saveCases(cases);
    toast('Кейс отправлен на модерацию','ok');
    APP.params={tab:'mine'};renderMain();attachPageEvents();
  });

  // Studio post form
  const postForm = $('#studioPostForm');
  if (postForm) postForm.addEventListener('submit',async e=>{
    e.preventDefault();
    const fd = new FormData(postForm);
    const user = currentUser();
    let coverUrl = fd.get('coverUrl')||'https://picsum.photos/seed/post_'+uid()+'/1200/500';
    const coverInput = postForm.querySelector('[name="coverFile"]');
    if (coverInput && coverInput.files.length>0) {
      try { coverUrl = await fileToDataURL(coverInput.files[0]); } catch {}
    }
    const attachments = [];
    const attInput = postForm.querySelector('[name="attachmentFiles"]');
    if (attInput) {
      for (const f of Array.from(attInput.files||[])) {
        let url = 'https://picsum.photos/seed/att_'+uid()+'/800/400';
        try { url = await fileToDataURL(f); } catch {}
        const kind = f.type.startsWith('video/')?'video':f.type.startsWith('image/')?'image':'file';
        attachments.push({kind,url,title:f.name});
      }
    }
    const extUrl = fd.get('externalUrl');
    if (extUrl) attachments.push({kind:fd.get('externalKind')||'image',url:extUrl,title:fd.get('title')+' (ссылка)'});
    const title = fd.get('title');
    const body = fd.get('body');
    const slug = title.toLowerCase().replace(/[^a-zа-яё0-9]+/gi,'-').replace(/^-|-$/g,'')+'-'+Date.now().toString(36).slice(-4);
    const ps = {id:'p_'+uid(),title,slug,excerpt:fd.get('excerpt')||body.slice(0,160),body,coverUrl,videoUrl:fd.get('videoUrl')||'',tags:fd.get('tags')||'',attachments,status:'pending',authorId:user.id,views:0,createdAt:new Date().toISOString(),reviewedAt:null};
    const posts = getPosts();posts.push(ps);savePosts(posts);
    toast('Статья отправлена на модерацию','ok');
    APP.params={tab:'mine'};renderMain();attachPageEvents();
  });

  // Moderation: skins
  $$('.moderate-skin-form').forEach(f=>f.addEventListener('submit',e=>{
    e.preventDefault();
    const btn = e.submitter;
    const decision = btn.value;
    const note = f.querySelector('[name="note"]').value;
    const skinId = f.dataset.skinId;
    const skins = getSkins();
    const s = skins.find(x=>x.id===skinId);
    if (s) { s.status=decision;s.reviewNote=note;s.reviewerId=currentUser().id;s.reviewedAt=new Date().toISOString(); }
    saveSkins(skins);
    toast(decision==='approved'?'Опубликовано':'Отклонено',decision==='approved'?'ok':'error');
    renderMain();attachPageEvents();
  }));

  // Moderation: cases
  $$('.moderate-case-form').forEach(f=>f.addEventListener('submit',e=>{
    e.preventDefault();
    const btn = e.submitter;
    const decision = btn.value;
    const note = f.querySelector('[name="note"]').value;
    const caseId = f.dataset.caseId;
    const cases = getCases();
    const c = cases.find(x=>x.id===caseId);
    if (c) { c.status=decision;c.reviewNote=note; }
    saveCases(cases);
    toast(decision==='approved'?'Кейс опубликован':'Отклонено',decision==='approved'?'ok':'error');
    renderMain();attachPageEvents();
  }));

  // Moderation: posts
  $$('.moderate-post-form').forEach(f=>f.addEventListener('submit',e=>{
    e.preventDefault();
    const btn = e.submitter;
    const decision = btn.value;
    const note = f.querySelector('[name="note"]').value;
    const postId = f.dataset.postId;
    const posts = getPosts();
    const p = posts.find(x=>x.id===postId);
    if (p) { p.status=decision;p.reviewNote=note;p.reviewedAt=new Date().toISOString(); }
    savePosts(posts);
    toast(decision==='approved'?'Статья опубликована':'Отклонено',decision==='approved'?'ok':'error');
    renderMain();attachPageEvents();
  }));

  // Case contents form
  $$('.case-contents-form').forEach(f=>f.addEventListener('submit',e=>{
    e.preventDefault();
    const caseId = f.dataset.caseId;
    const skinIds = Array.from(f.querySelectorAll('[name="skinIds"]:checked')).map(c=>c.value);
    const cases = getCases();
    const c = cases.find(x=>x.id===caseId);
    if (c) { c.skinIds=skinIds; c.weights=skinIds.map(()=>10); }
    saveCases(cases);
    toast('Содержимое обновлено','ok');
  }));

  // Admin user form
  $$('.admin-user-form').forEach(f=>f.addEventListener('submit',e=>{
    e.preventDefault();
    const fd = new FormData(f);
    const userId = f.dataset.userId;
    const delta = parseMoney(fd.get('balanceDelta'));
    const users = getUsers();
    const u = users.find(x=>x.id===userId);
    if (u) {
      u.role=fd.get('role');
      u.status=fd.get('status');
      if (delta) u.balance=Math.max(0,u.balance+delta);
      if (u.status==='banned') {
        const sessions = getSessions().filter(s=>s.userId!==u.id);
        saveSessions(sessions);
      }
    }
    saveUsers(users);
    toast('Пользователь обновлён','ok');
    renderMain();attachPageEvents();
  }));

  // Avatar upload zone click
  const avatarZone = $('#avatarUploadZone');
  if (avatarZone) {
    const input = $('#avatarInput');
    avatarZone.addEventListener('click',()=>input?.click());
    input?.addEventListener('change',()=>{
      const preview = $('#avatarPreview');
      if (!preview||!input.files.length) return;
      preview.innerHTML='';
      const f=input.files[0];
      if (f.type.startsWith('image/')) {
        const img = document.createElement('img');
        img.src=URL.createObjectURL(f);
        img.style.cssText='width:4rem;height:4rem;object-fit:cover;border:1px solid var(--line);margin-top:.5rem';
        preview.appendChild(img);
      }
    });
  }
}

// ======================== GLOBAL ACTIONS ========================

function buySkin(skinId) {
  const user = currentUser();
  if (!user) { navigate('login'); return; }
  const skins = getSkins();
  const skin = skins.find(s=>s.id===skinId);
  if (!skin||skin.status!=='approved') { toast('Скин недоступен','error'); return; }
  if (user.balance<skin.price) { toast('Недостаточно средств','error'); return; }
  updateUser(user.id,{balance:user.balance-skin.price});
  const orders=getOrders();
  orders.push({id:'o_'+uid(),userId:user.id,total:skin.price,status:'paid',items:skin.title,createdAt:new Date().toISOString()});
  saveOrders(orders);
  const inv=getInventory();
  inv.push({id:'i_'+uid(),userId:user.id,skinId:skin.id,source:'purchase',pricePaid:skin.price,createdAt:new Date().toISOString()});
  saveInventory(inv);
  toast('Куплено: '+skin.title,'ok');
  navigate('dashboard',{tab:'inventory'});
}

function toggleFavorite(skinId) {
  const user = currentUser();
  if (!user) { navigate('login'); return; }
  const favs = getFavorites();
  const idx = favs.findIndex(f=>f.userId===user.id&&f.skinId===skinId);
  if (idx>=0) { favs.splice(idx,1); toast('Убрано из избранного','ok'); }
  else { favs.push({id:'f_'+uid(),userId:user.id,skinId,createdAt:new Date().toISOString()}); toast('В избранном','ok'); }
  saveFavorites(favs);
  renderMain();attachPageEvents();
}

// ======================== HASH ROUTING ========================

function handleHash() {
  const hash = location.hash.slice(1)||'home';
  const parts = hash.split('/');
  const page = parts[0]||'home';
  const param = parts[1]||'';
  const pageMap = {
    home:'home',skins:'skins',skin:'skinDetail',cases:'cases',case:'caseDetail',
    blog:'blog',post:'postDetail',login:'login',register:'register',
    dashboard:'dashboard',studio:'studio',admin:'admin',
  };
  APP.page = pageMap[page]||'home';
  APP.params = {};
  if (page==='skin'&&param) APP.params={id:param};
  if (page==='case'&&param) APP.params={id:param};
  if (page==='post'&&param) APP.params={slug:param};
  render();
  attachPageEvents();
}

window.addEventListener('hashchange', handleHash);
window.addEventListener('load', handleHash);
</script>
